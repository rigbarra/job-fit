# Configuración general del pipeline de búsqueda de empleo (Chile + Internacional Fallback)

# Ámbito de búsqueda activo: 'chile' (solo nacional), 'international' (solo internacional), o 'all' (ambos)
search_scope: "all"

# Filtros de búsqueda para scraping
search_filters:
  keywords:
    - "Analytics Engineer"
    - "Data Engineer"
    - "Ingeniero de Datos"
    - "Analista de Datos Senior"
    - "Especialista de Datos"
    - "Especialista BI"
    - "Data Platform Engineer"
    - "Senior Data Analyst"
    - "BI Engineer"
    - "Ingeniero BI"
    - "Arquitecto de Datos"
    - "Data Architect"
    - "AI Engineer"
  locations:
    - "Chile"
  international_locations:
    - "Latin America"
    - "Worldwide"
  max_job_age_days: 1    # Ventana móvil estricta de 1 día (24 horas) para avisos nuevos
  experience_level: ""   # Vacío para capturar todas las ofertas (el filtro algorítmico local descarta juniors y jefaturas)
  limit_per_source: 100
  excluded_companies:
    - "BairesDev"

# Umbrales de clasificación de coincidencia (Match Score)
match_thresholds:
  tier_1_high: 85        # >= 85% -> Postulación Directa (sin retoque de CV)
  tier_2_medium: 60      # 60% a 84% -> Requiere Retoque de CV

# Fuentes activas de scraping
sources:
  getonboard: true       # API REST de Get on Board para Chile (muy estable)
  linkedin: true         # Endpoints públicos guest de LinkedIn
  indeed: true          # Indeed (Habilitado vía JobSpy)
  remotive: true         # API REST para vacantes internacionales y LATAM
  
# Control de Notificaciones y Evaluación por Ubicación y Tier
notification_rules:
  min_score_to_notify: 75    # Umbral calibrado: notifica Tier 1 y Tier 2 de alto impacto (75-100 pts)
  national:
    allow_tier_1: true    # Match Directo Chile
    allow_tier_2: true    # Match con Retoque Chile
  international:
    allow_tier_1: true    # Match Directo Internacional (LATAM / Contractor)
    allow_tier_2: false   # Desactivado: Para el extranjero solo competir con Match Directo (Tier 1)

# Cautela y Control de Bloqueos (Rate Limiting)
rate_limiting:
  min_delay_seconds: 4.0
  max_delay_seconds: 7.0
  max_errors_before_circuit_break: 1

# Filtro Algorítmico Local (Ahorro de Tokens del LLM)
algorithmic_filter:
  enabled: true
  min_semantic_score: 55.0  # Umbral de similitud semántica vectorial local (0 a 100 pts). < 55 = descarte local (0 tokens LLM).
  # El título DEBE contener al menos una de estas palabras clave técnicas específicas de datos.
  # (Se eliminaron 'analista' y 'analyst' solitarios para evitar falsos amigos operacionales/PMO/procesos).
  title_keywords_any:
    - "data"
    - "datos"
    - "dato"
    - "analytics"
    - "analitica"
    - "analítica"
    - "analista de datos"
    - "analista data"
    - "analista bi"
    - "bi engineer"
    - "ingeniero bi"
    - "ingeniero de datos"
    - "ingeniera de datos"
    - "especialista de datos"
    - "especialista data"
    - "especialista bi"
    - "arquitecto de datos"
    - "arquitecta de datos"
    - "data architect"
    - "modelador de datos"
    - "modeladora de datos"
    - "dbt"
    - "etl"
    - "pipeline"
    - "intelligence"
    - "inteligencia artificial"
    - "machine learning"
    - "mlops"
    - "ia engineer"
    - "ai engineer"
    - "genai"
    - "llm"
  # La descripción debe contener AL MENOS UNA de estas palabras (OR, no AND).
  # Antes era AND (sql Y python) lo que rechazaba avisos legítimos con descripciones cortas.
  description_keywords_any:
    - "sql"
    - "python"
    - "aws"
    - "gcp"
    - "azure"
    - "bigquery"
    - "redshift"
    - "snowflake"
    - "spark"
    - "dbt"
    - "airflow"
    - "pipeline"
    - "power bi"
    - "tableau"
    - "looker"

