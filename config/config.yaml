      keywords: ["ai engineer", "ia engineer", "llm", "genai", "prompt engineer", "inteligencia artificial", "artificial intelligence", "generative ai", "ai &", "& ai", "ai senior"]
    - name: "Machine Learning / MLOps Engineer"
      keywords: ["machine learning", "ml engineer", "mlops", "deep learning", "aprendizaje automático", "aprendizaje automatico", "soluciones de aprendizaje"]
    - name: "Analytics Engineer"
      keywords: ["analytics engineer", "analytics engineering", "ingeniero de analitica", "ingeniero de analítica", "ingeniera de analítica"]
    - name: "Data Architect"
      keywords: ["data architect", "arquitecto de datos", "arquitecta de datos", "arquitectura de datos", "plataforma de datos"]
    - name: "Data Engineer"
      keywords: ["data engineer", "ingeniero de datos", "ingeniera de datos", "ingeniería de datos", "big data", "etl engineer", "data platform", "pipeline engineer", "data layer developer", "data operations engineer", "ingeniero sql", "streaming/flink", "flink"]
    - name: "Data Scientist"
      keywords: ["data scientist", "cientifico de datos", "científico de datos", "cientista de datos", "data science"]
    - name: "Data Analyst & BI Specialist"
      keywords: ["data analyst", "analista de datos", "analista datos", "bi analyst", "analista bi", "business intelligence", "power bi", "tableau", "looker", "analytics specialist", "analista analitica", "analista analítica", "data quality", "data steward", "adobe analytics", "business analyst", "data enablement", "operations insights"]
    - name: "Other Data & Analytics"
      keywords: ["data", "datos", "analytics", "analítica", "analitica"]

