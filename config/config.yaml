# Configuración del Vault de Obsidian y Kanban
obsidian:
  vault_path: "auto" # 'auto' detecta dinámicamente tu usuario Windows en WSL (Documents/Obsidian Vaults/job-fit) o ./output/obsidian en Linux/Docker. También puedes fijar una ruta absoluta o usar OBSIDIAN_VAULT_PATH en .env
  auto_clean_orphans: true # Si borras una tarjeta del tablero, purga automáticamente sus archivos .md y .pdf del disco
  start_cutoff: "2026-09-04 21:10:00" # Punto de corte temporal para vacantes nuevas
  ghosted_days_threshold: 60 # Días desde publicación para mover automáticamente a 'Ghosted / Sin Respuesta'

# ==============================================================================
# EVALUACIÓN LLM — Adapta esta sección para personalizar el dominio profesional.
# Todo lo de aquí se inyecta en el prompt de evaluación. No tocar prompts.py.
# ==============================================================================
evaluation:
  # Descripción del dominio profesional del candidato (para el rol del evaluador LLM)
  domain: "Data Engineering, Analytics Engineering, BI y Analítica de Negocio / Analytics Translation (Data Engineers, Analytics Engineers, BI Specialists/Leads, Customer Intelligence & Analytics Translators)"

  # Stack técnico base que define un "Technical Skills Match" alto
  core_stack: "SQL (Kimball/CTEs), Python (Pandas/Polars/PySpark), dbt, Cloud AWS Serverless/GCP/Azure, Power BI (DAX/Modelado Semántico), Airflow/Dagster, Redshift/Snowflake/BigQuery, Business & Customer Analytics"

  # Ubicación física del candidato (para compuerta territorial)
  candidate_location: "Chile (Viña del Mar)"

  # Idiomas del candidato (para compuerta de idioma)
  candidate_languages: "Inglés B2+ y Español nativo"

  # Modalidad aceptada para ofertas en Chile
  accepted_modality_chile: "100% Remoto o Híbrido (hasta 2 días/semana presencial)"

  # Compuerta de tipo de rol: estos roles son Tier 3 automático (score 40–59 pts máximo).
  # Ajusta esta lista según tu perfil y los roles que NO quieres postular.
  role_gate_fail:
    - "PMO"
    - "Analista de Proyectos"
    - "Gestor de Proyectos"
    - "Analista de Gestión"
    - "Control de Gestión"
    - "Analista de Procesos"
    - "Mejora Continua"
    - "Lean"
    - "Analista de Operaciones"
    - "Analista Comercial"
    - "Analista Funcional ERP"
    - "Analista Funcional SAP"
    - "consultor generalista"

  # Roles que parecen fuera del dominio pero SÍ se evalúan normalmente.
  role_gate_pass_exceptions:
    - "Data Analyst"
    - "Senior Data Analyst"
    - "Analista de Datos"
    - "Analista de Datos Senior"
    - "Analista BI"
    - "Analista de Inteligencia de Negocios"
    - "Especialista de Datos"
    - "Especialista BI"
    - "Especialista Analitica"
    - "Especialista Inteligencia de Negocios"
    - "Analytics Translator"
    - "Customer Intelligence Specialist"
    - "Product Analyst con SQL"
    - "Arquitecto de Datos"
    - "Data Architect"
    - "Revenue Analyst con SQL"
    - "CRM Analyst con SQL"

  # Definición de career_alignment alto (Tier 1 / score alto en esa dimensión)
  career_alignment_high: "Rol técnico o estratégico de datos, analítica avanzada, BI o ingeniería con stack explícito (pipelines, modelos Kimball, arquitectura cloud, dbt, SQL, Python, Power BI semántico o traducción analítica de negocio). Título es Data/Analytics/Platform/BI Engineer, Analytics Translator, Customer Intelligence Specialist, Senior Data Analyst, Especialista BI/Datos o Data Architect."

  # Definición de career_alignment medio
  career_alignment_mid: "Rol de datos con requerimientos analíticos básicos o soporte de reportería tradicional, sin ingeniería moderna ni transformaciones complejas."

  # Definición de career_alignment bajo (Tier 3 en esa dimensión)
  career_alignment_low: "Rol que menciona datos periféricamente (reportes Excel, dashboards básicos) sin stack de ingeniería, o rol de gestión/procesos/PMO."
