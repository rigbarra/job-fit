# Configuración general del pipeline de búsqueda de empleo (ENFOQUE 100% CHILE)

# Filtros de búsqueda para scraping
search_filters:
  keywords:
    - "Analytics Engineer"
    - "Data Engineer"
    - "Ingeniero de Datos"
  locations:
    - "Chile"
    - "Santiago"
    - "Remote"
    - "Remoto"
  max_job_age_days: 1    # Solo evaluar vacantes publicadas en las últimas 24 horas (ventana de 1 día)
  experience_level: "4"  # Nivel de experiencia LinkedIn (f_E=4: Mid-Senior Level)
  limit_per_source: 20

# Umbrales de clasificación de coincidencia (Match Score)
match_thresholds:
  tier_1_high: 85        # >= 85% -> Postulación Directa (sin retoque de CV)
  tier_2_medium: 60      # 60% a 84% -> Requiere Retoque de CV
  # < 60% es Tier 3 -> Descarte

# Fuentes activas de scraping (Solo portales que operan en Chile)
sources:
  getonboard: true       # API REST de Get on Board para Chile (muy estable)
  linkedin: true         # Endpoints públicos guest de LinkedIn Chile
  indeed: true           # Indeed Chile (cl.indeed.com)
  remotive: false        # Desactivado (fuente puramente internacional)

# Control de Notificaciones y Evaluación por Ubicación y Tier
notification_rules:
  national:
    allow_tier_1: true    # 🇨🇱 Match Directo Chile
    allow_tier_2: true    # 🇨🇱 Match con Retoque Chile
  international:
    allow_tier_1: false   # 🌐 Desactivado completamente por urgencia en Chile
    allow_tier_2: false   # 🌐 Desactivado completamente

# Cautela y Control de Bloqueos (Rate Limiting)
rate_limiting:
  min_delay_seconds: 4.0  # Tiempo mínimo de espera entre llamadas a páginas de detalle
  max_delay_seconds: 7.0  # Tiempo máximo de espera entre llamadas
  max_errors_before_circuit_break: 1 # Detener inmediatamente el scraper si detecta 403 o 429

# Filtro Algorítmico Local (Ahorro de Tokens del LLM)
algorithmic_filter:
  enabled: true
  title_keywords_any:
    - "data"
    - "analytics"
    - "bi"
    - "dbt"
    - "etl"
    - "pipeline"
    - "intelligence"
    - "datos"
    - "analista"
    - "ingeniero"
  description_keywords_all:
    - "sql"
