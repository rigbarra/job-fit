# Configuración general del pipeline de búsqueda de empleo

# Filtros de búsqueda para scraping
search_filters:
  keywords:
    - "Analytics Engineer"
    - "Data Engineer"
    - "Ingeniero de Datos"
  locations:
    - "Remote"
    - "Remoto"
    - "Chile"
    - "Santiago"
  limit_per_source: 20

# Umbrales de clasificación de coincidencia (Match Score)
match_thresholds:
  tier_1_high: 85        # >= 85% -> Postulación Directa (sin retoque de CV)
  tier_2_medium: 60      # 60% a 84% -> Requiere Retoque de CV
  # < 60% es Tier 3 -> Descarte

# Fuentes activas de scraping
sources:
  remotive: true         # API REST, muy estable
  indeed: false          # Desactivado por defecto por seguridad de IP
  adzuna: false          # Requiere registrarse para obtener API Key
  linkedin: false        # Best-effort (desactivado por defecto)

# Cautela y Control de Bloqueos (Rate Limiting)
rate_limiting:
  min_delay_seconds: 5.0  # Tiempo mínimo de espera entre llamadas a páginas de detalle
  max_delay_seconds: 10.0 # Tiempo máximo de espera entre llamadas
  max_errors_before_circuit_break: 1 # Detener inmediatamente el scraper si detecta 403 o 429

