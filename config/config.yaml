# Configuración general del pipeline de búsqueda de empleo (Chile + Internacional Fallback)

# Ámbito de búsqueda activo: 'chile' (solo nacional), 'international' (solo internacional), o 'all' (ambos)
search_scope: "chile"

# Filtros de búsqueda para scraping
search_filters:
  keywords:
    - "Analytics Engineer"
    - "Data Engineer"
    - "Ingeniero de Datos"
    - "AI Engineer"
    - "Ingeniero IA"
    - "Data Analyst"
    - "Analista BI"
  locations:
    - "Chile"
    - "Santiago"
    - "Valparaíso"
    - "Valparaiso"
    - "Viña del Mar"
    - "Vina del Mar"
  max_job_age_days: 2    # Ventana de 24 horas para corridas recurrentes (3 veces al día)
  experience_level: "4"  # Nivel de experiencia LinkedIn (f_E=4: Mid-Senior Level)
  limit_per_source: 35

# Umbrales de clasificación de coincidencia (Match Score)
match_thresholds:
  tier_1_high: 85        # >= 85% -> Postulación Directa (sin retoque de CV)
  tier_2_medium: 60      # 60% a 84% -> Requiere Retoque de CV

# Fuentes activas de scraping
sources:
  getonboard: true       # API REST de Get on Board para Chile (muy estable)
  linkedin: true         # Endpoints públicos guest de LinkedIn
  indeed: true          # Indeed (Habilitado vía JobSpy)
  remotive: false        # API REST para vacantes internacionales (desactivado temporalmente)

# Control de Notificaciones y Evaluación por Ubicación y Tier
notification_rules:
  national:
    allow_tier_1: true    # Match Directo Chile
    allow_tier_2: true    # Match con Retoque Chile
  international:
    allow_tier_1: true    # Match Directo Internacional (LATAM / Contractor)
    allow_tier_2: true    # Match con Retoque Internacional (Activado para calibración)

# Cautela y Control de Bloqueos (Rate Limiting)
rate_limiting:
  min_delay_seconds: 4.0
  max_delay_seconds: 7.0
  max_errors_before_circuit_break: 1

# Filtro Algorítmico Local (Ahorro de Tokens del LLM)
algorithmic_filter:
  enabled: true
  # El título DEBE contener al menos una de estas palabras.
  # IMPORTANTE: Ser específico aquí evita capturar basura de Indeed (técnicos, electricistas, RRHH).
  # 'ingeniero' fue eliminado intencionalmente — es demasiado amplio y captura roles no relacionados.
  title_keywords_any:
    - "data"
    - "analytics"
    - "ingeniero de datos"
    - "analista de datos"
    - "analista bi"
    - "analista data"
    - "bi"
    - "dbt"
    - "etl"
    - "pipeline"
    - "intelligence"
    - "inteligencia artificial"
    - "machine learning"
    - "mlops"
    - "ia engineer"
    - "ai engineer"
  # La descripción debe contener AL MENOS UNA de estas palabras (OR, no AND).
  # Antes era AND (sql Y python) lo que rechazaba avisos legítimos con descripciones cortas.
  description_keywords_any:
    - "sql"
    - "python"
    - "aws"
    - "gcp"
    - "azure"
    - "bigquery"
    - "redshift"
    - "snowflake"
    - "spark"
    - "dbt"
    - "airflow"
    - "pipeline"
    - "power bi"
    - "tableau"
    - "looker"

