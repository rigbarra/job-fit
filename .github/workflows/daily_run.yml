name: Daily Job Fit Pipeline

on:
  schedule:
    # Lunes a Viernes a las 12:00 UTC (08:00 AM Chile, UTC-4)
    - cron: "0 12 * * 1-5"
  workflow_dispatch: # Permite ejecución manual con 1 clic desde GitHub Actions

jobs:
  run-pipeline:
    name: Run Job Ingestion & Matcher Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install System Dependencies (TeX Live for LaTeX CV compilation)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-lang-spanish

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Job-Fit Pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DATABASE_URL: sqlite:///data/db/job_fit.db
          OUTPUT_PDF_DIR: ./data/generated_cvs
          TEMPLATES_DIR: ./templates/cv
        run: |
          PYTHONPATH=. python src/main.py

      - name: Upload Generated CV PDFs as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-cvs-${{ github.run_id }}
          path: data/generated_cvs/*.pdf
          if-no-files-found: ignore
